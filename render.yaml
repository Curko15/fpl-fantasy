# Render Blueprint for the backend API. Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: fpl-league-api
    runtime: python
    plan: free # switch to "starter" ($7/month) to stop it sleeping
    region: frankfurt
    rootDir: backend
    buildCommand: pip install ".[postgres]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: FPL_DATABASE_URL # Neon connection string
        sync: false
      - key: FPL_CORS_ORIGINS # e.g. ["https://your-app.vercel.app"]
        sync: false
      - key: FPL_REFRESH_TOKEN # same value as the GitHub secret REFRESH_TOKEN
        generateValue: true
